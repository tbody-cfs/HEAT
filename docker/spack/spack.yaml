# HEAT spack environment
# ----------------------
# Defines the scientific dependency stack that the HEAT builder image installs
# into /opt/software (see docker/spack/spack_config.yaml) and exposes through the
# filesystem view at /opt/views/view. The builder image compiles the components
# that have no spack package (MAFOT, M3DC1/fusion-io, swak4Foam, heatFoam) and the
# pip-only Python wheels on top of what this environment provides.
#
# Portability: concretizer.targets.granularity=generic keeps builds to a portable
# baseline. The builder Dockerfile ALSO injects a hard per-arch requirement at build
# time (x86_64_v3 on amd64, aarch64 on arm64) via:
#   spack -e . config add "packages:all:require:target=<arch>"
# so binaries pulled from / pushed to the OCI cache stay portable and are not tuned
# to the exact CI-runner CPU. Do not hard-code the target here.
spack:
  specs:
    # --- toolchain / core numerics ---
    - cmake
    - openmpi
    - hdf5 +mpi +fortran +hl   # +hl is load-bearing: FreeCAD's SMESH links libhdf5_hl (see freecad overlay patch())
    - netcdf-c +mpi
    - netcdf-fortran
    - netcdf-cxx4
    - openblas threads=openmp          # BLAS + LAPACK

    # --- Python interpreter + compiled scientific packages ---
    # spack owns numpy/scipy/etc so the whole stack shares ONE numpy ABI. This is
    # what eliminates the numpy 2.x / scipy ABI breakage worked around in the old
    # apt+pip Dockerfile.
    # Runtime python is pinned to 3.11: freecad's (old) py-pyside2 caps the python it can
    # build against, and under unify:when_possible the whole runtime science stack settles
    # onto this same interpreter (verified: freecad, py-numpy, py-scipy, vtk, py-matplotlib,
    # py-h5py all link python@3.11.x, single py-numpy). Newer pythons appear only as
    # build-tool deps (not in the view). Pinning 3.11 keeps ONE python in the copied view.
    - python@3.11
    - py-pip
    - py-setuptools
    - py-wheel
    - py-numpy
    - py-scipy
    - py-pandas
    - py-matplotlib
    - py-h5py +mpi
    - py-netcdf4
    - py-mpi4py
    # NOTE: py-pillow / py-scikit-image / py-scikit-learn / py-trimesh are intentionally
    # NOT here. Their numpy version pins collide with freecad's py-pyside2 (py-pip cap)
    # under concretizer.unify:true. They are pure/light packages, so they are installed
    # in the pip venv (docker/heat.dockerfile) layered on spack's python with
    # --system-site-packages, where they bind to spack's numpy at runtime.

    # --- heavy scientific applications (maximal spack scope) ---
    - openfoam@2306                    # ESI / openfoam.com line, matches the current v2306 build
    - gmsh +opencascade +fltk
    - vtk +python +opengl2
    - freecad                          # in spack: HEAT does `import FreeCAD` in-process, so it must
                                       # be built against this env's python. Pulls py-pyside2 (old),
                                       # which caps py-pip@:23.0 -> requires unify:when_possible below.
    - elmerfem +mpi
    # ParaView is NOT in spack: it is apt-installed in the final image. HEAT uses it via
    # pvpython (subprocess) / system-python bindings, not in-process, so it need not share
    # this env's python. Keeping it out avoids its heavy Qt/python build and its
    # matplotlib->pillow pins fighting freecad's pyside2.

  # Source-tarball fallback mirror. Some upstreams delete old release tarballs/tags
  # (e.g. github.com/szcompressor/SZ dropped ALL its releases + tags, so sz@2.1.12.5's
  # download URL — and every other sz version's — now 404s). Spack's canonical public
  # mirror still hosts these sources by sha256, so listing it lets `spack install` fall
  # back to it when the upstream URL is dead. This bit only aarch64 in practice because
  # x86 pulled a prebuilt sz binary and never fetched the source; on arm no binary exists
  # so the fetch (and thus the whole build) failed. `binary: false` keeps this a
  # source-only fallback: it adds no binary index and therefore CANNOT change
  # concretization, so both arches' graphs are unaffected. Both build paths
  # (heat-builder.dockerfile and docker/spack/build-local.sh) install from this env, so
  # this single entry covers both.
  mirrors:
    spack-public-src:
      url: https://mirror.spack.io
      source: true
      binary: false

  # Pin the compiler so every node builds with the image's gcc (registered as an
  # external in the builder Dockerfile via `spack external find gcc`). Use the
  # per-language provider form (spack's recommendation) rather than a blanket
  # `all: require: "%gcc"`, which warns and can cause spurious concretization errors.
  packages:
    c:
      require:
        - gcc
    cxx:
      require:
        - gcc
    fortran:
      require:
        - gcc
    # Use the system OpenGL (apt libraries, declared external) instead of building
    # spack's mesa. mesa is the sole consumer of llvm here, so this removes BOTH mesa
    # AND llvm from the graph (a ~2.5 hr clang/lldb/lld/polly build). HEAT is headless
    # (Dash web GUI + apt ParaView; no in-process GL rendering), so system GL suffices at
    # runtime and only needs to link at build time. The builder apt-installs the GL dev
    # libs (see docker/heat-builder.dockerfile). Verified: mesa/llvm drop out; vtk,
    # freecad, gmsh still resolve.
    opengl:
      buildable: false
      externals:
        - spec: opengl@4.6
          prefix: /usr
    # NOTE: qt is NOT an external. It was tried as an apt external, but py-pyside2's
    # patch() reaches THROUGH qt into its dependency subtree
    # (`self.spec["qt"]["glx"]["libglx"]`, `self.spec["qt"]["libxcb"]`) — a depless external
    # qt raises `KeyError: No spec with name glx`. Since qt's only consumers are
    # py-pyside2 + freecad (vtk is ~qt; coin3d needs glx directly, not qt), the external
    # bought nothing, so qt is built by spack. With opengl still external, spack-built qt
    # gets qt->glx->[external opengl] (opengl provides glx+libglx) and qt->libxcb, so
    # pyside2's patch() resolves. See SPACK_MIGRATION_PROGRESS.md §4g.
    #
    # Use the system LLVM 15 (apt llvm-15 + libclang-15-dev, declared external) for
    # py-pyside2/shiboken (which needs libclang@10:15 to generate the Qt python bindings).
    # This avoids a ~1.5-2 hr spack llvm@15 build. Ubuntu 24.04 ships llvm 15.0.7. llvm is
    # a BUILD-only dep of pyside2, so it never ships in the final image. The spec below is
    # exactly what `spack external find llvm` detects for the apt packages (verified to
    # build pyside2). See §4c/§4d.
    llvm:
      buildable: false
      externals:
        - spec: llvm@15.0.7+clang~flang~lld~lldb
          # prefix is /usr/lib/llvm-15, NOT /usr. Ubuntu's llvm-15 is a self-contained
          # versioned tree there (bin/clang, lib/libclang.so, include/clang-c/Index.h);
          # /usr/bin/clang-15 etc. are just symlinks into it. py-pyside2's shiboken CMake
          # (data/shiboken_helpers.cmake setup_clang) searches <llvm prefix>/lib for
          # libclang.so|libclang.so.1 -> with prefix=/usr it looks in /usr/lib and fails
          # ("Unable to find the Clang library in /usr"), because the unversioned
          # libclang.so lives under /usr/lib/llvm-15/lib (or the multiarch
          # /usr/lib/x86_64-linux-gnu/libclang-15.so.1), not /usr/lib. Pointing the prefix
          # at the llvm-15 root makes shiboken resolve libclang. See §4c/§4d.
          prefix: /usr/lib/llvm-15
          extra_attributes:
            compilers:
              c: /usr/bin/clang-15
              cxx: /usr/bin/clang++-15
    # Pin py-pyside2 to a real 5.15 release. The solver otherwise picks @develop, which is
    # BROKEN in spack 1.2.2: it references self.spec["llvm"] unconditionally but only
    # depends_on llvm `when="@5.15"`, so @develop has no llvm node -> KeyError. @5.15.14
    # pulls llvm@10:15+clang (satisfied by the external above). See §4c.
    py-pyside2:
      require:
        - "@5.15.14"
    # flann is pulled transitively (freecad -> pcl -> flann@1.9.2). Its default +mpi
    # variant drags in boost@1.89, and flann 1.9.2's (2018) CMake asks for a compiled
    # `boost_system` component that modern boost no longer ships (Boost.System went
    # header-only) -> "Could not find boost_system" cmake failure. pcl only needs flann's
    # kd-tree, not its MPI, so ~mpi drops the boost dependency and the build succeeds.
    flann:
      require:
        - "~mpi"
    # HARD-require the numeric-virtual providers, so the whole stack shares ONE
    # BLAS/LAPACK/FFT ABI (openblas + fftw). These MUST be `require`, not just the
    # `providers:` preference below: a preference is advisory and the concretizer
    # overrode it under unify:when_possible + binary-cache reuse — it satisfied openfoam's
    # fftw-api dependency with a prebuilt intel-oneapi-mkl@2026 binary (a multi-GB library
    # that also injects intel-oneapi-runtime across the graph, contradicting the
    # single-openblas design and risking numpy/scipy linking MKL). A requirement is a hard
    # constraint reuse cannot beat, so MKL is excluded outright. Verified: openfoam was the
    # sole fftw-api consumer pulling MKL.
    fftw-api:
      require: [fftw]
    blas:
      require: [openblas]
    lapack:
      require: [openblas]
    all:
      providers:
        # Preference order (kept as a hint; the hard requirements above are what bind).
        blas: [openblas]
        lapack: [openblas]
        fftw-api: [fftw]
        gl: [opengl]
        glx: [opengl]
        egl: [opengl]

  concretizer:
    # when_possible (not true): freecad's old py-pyside2 caps py-pip@:23.0 while modern
    # py-numpy's build toolchain wants a newer py-pip. py-pip is a BUILD-ONLY tool (never
    # imported at runtime), so letting it fork is harmless. Verified that the RUNTIME-
    # critical packages stay single-version under when_possible: one python (3.11.15, the
    # version pinned above) and one py-numpy across the whole env, so HEAT's single
    # interpreter has a consistent ABI.
    # If a future change forks python or py-numpy, that is a red flag — re-check here.
    unify: when_possible
    targets:
      granularity: generic             # portable baseline microarch

  view: /opt/views/view

  # Custom repo overlay (namespace: heat) carrying local package fixes for spack 1.2.2
  # builtin packages that are broken for this stack — currently py-pivy, freecad, elmerfem, pcl.
  # Each overlay package.py's header documents its delta vs the builtin package. The builder
  # COPYs docker/spack/repo to this path.
  repos:
    - /opt/spack-environment/repo/spack_repo/heat
