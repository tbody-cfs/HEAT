# Build and publish the HEAT spack builder image to ghcr.io (multi-arch), warming the
# shared spack OCI buildcache as it goes.
#
# WHAT IT DOES
#   * Builds docker/heat-builder.dockerfile on NATIVE runners, one per architecture
#     (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm), pushes each as an untagged
#     digest, then merges the digests into ONE multi-arch manifest at
#     ghcr.io/<owner>/heat-builder:<tags>.
#   * Populates the spack OCI buildcache (ghcr.io/<owner>/heat-spack-cache) as it builds
#     — with --autopush in the Dockerfile each spec is pushed the moment it compiles, so
#     later builds (CI or local) pull prebuilt binaries instead of recompiling. The
#     buildcache is arch-aware, so amd64 and arm64 binaries coexist in the same cache.
#
# WHY NATIVE RUNNERS (not QEMU): the builder compiles the entire scientific stack from
# source (OpenFOAM, FreeCAD, VTK, Elmer, Qt, OpenCASCADE, ...). Emulating arm64 on an
# amd64 runner via QEMU would turn a multi-hour build into a multi-DAY one, so each arch
# builds on its own native runner. The Dockerfile already selects the per-arch spack
# target (x86_64_v3 on amd64, generic aarch64 / ARMv8-A on arm64).
#
# ARM64 IS BEST-EFFORT ("try"): the arm64 leg is marked experimental (continue-on-error).
# If it fails — an unported spack package, a missing apt external, no cache yet — the
# workflow still succeeds and publishes an amd64-only (or amd64 + whatever arm digest
# succeeded) manifest. Promote arm64 to required once it builds reliably (drop
# `experimental: true`).
#
# ONE-TIME SETUP
#   * Only the default GITHUB_TOKEN is needed (ghcr login + spack OCI buildcache auth).
#   * arm64 hosted runners: `ubuntu-24.04-arm` is GA for public repos; private repos need
#     Team/Enterprise (or swap in a self-hosted arm64 runner label). If unavailable, the
#     arm leg fails harmlessly (best-effort) until a runner exists.
#   * First cold build per arch is long; ubuntu hosted runners cap at 360 min. If a cold
#     build exceeds that, use a larger/self-hosted runner. Subsequent runs are fast
#     (buildcache hits).

name: Build HEAT builder image

on:
  workflow_dispatch:
  release:
    types: [released]
  schedule:
    - cron: '23 1 1 * *'   # monthly: refresh the toolchain + cache

permissions:
  contents: read
  packages: write

concurrency:
  group: build-heat-builder
  cancel-in-progress: false

env:
  BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/heat-builder

jobs:
  # ---------------------------------------------------------------------------
  # One build per architecture, on a native runner. Each pushes an untagged
  # digest to ghcr; the merge job stitches them into a multi-arch manifest.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # arm64 is best-effort: its failure must not fail the workflow or the amd64 leg.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            experimental: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Platform pair label (linux/amd64 -> linux-amd64)
        id: prep
        env:
          platform: ${{ matrix.platform }}
        run: |
          echo "pair=$(echo "$platform" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provide GITHUB_TOKEN to BuildKit for the spack OCI cache
        run: echo "${{ secrets.GITHUB_TOKEN }}" > "${RUNNER_TEMP}/ghcr_token"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/heat-builder.dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SPACK_OCI_USER=${{ github.actor }}
          secret-files: |
            ghcr_token=${{ runner.temp }}/ghcr_token
          # Per-arch gha cache scope so the two legs don't clobber each other's layer cache.
          cache-from: type=gha,scope=heat-builder-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,mode=max,scope=heat-builder-${{ steps.prep.outputs.pair }}
          # Push an untagged digest; the merge job assembles the tagged manifest list.
          outputs: type=image,name=${{ env.BUILDER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge whatever per-arch digests were produced into one multi-arch manifest.
  # Runs even if the arm64 leg failed (if: always()), so amd64 always publishes.
  # ---------------------------------------------------------------------------
  merge:
    name: merge manifest
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BUILDER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=edge
            type=sha
            type=ref,event=tag

      - name: Fail if no arch built
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(ls -1 | wc -l)
          echo "digests present: $count"
          [ "$count" -ge 1 ] || { echo "::error::no per-arch digest was produced"; exit 1; }

      - name: Create multi-arch manifest from available digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.BUILDER_IMAGE }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ${{ env.BUILDER_IMAGE }}:${{ steps.meta.outputs.version }}
